components:
  comp_catalogue_api:
    mode: local
    e2e_command: cd services/catalogue-api && pnpm e2e
    test_command: cd services/catalogue-api && pnpm test
    build_command: cd services/catalogue-api && pnpm build
    devloop_command: cd services/catalogue-api && pnpm devloop
  comp_web_app:
    mode: local
    e2e_command: cd apps/web && pnpm e2e
    test_command: cd apps/web && pnpm test
    build_command: cd apps/web && pnpm build
    devloop_command: cd apps/web && pnpm devloop
commands:
  test: (cd services/catalogue-api && pnpm test) && (cd apps/web && pnpm test)
  build: (cd services/catalogue-api && pnpm build) && (cd apps/web && pnpm build)
  devloop: (cd services/catalogue-api && pnpm devloop) && (cd apps/web && pnpm devloop)
setup_command: (cd apps/web && pnpm install --frozen-lockfile) && (cd services/catalogue-api
  && pnpm install --frozen-lockfile)
toolchain:
  node: '22'
  pnpm: 12.9.1
